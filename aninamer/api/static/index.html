<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aninamer review</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <h1>aninamer</h1>
          <span id="runtimeStatus">未连接</span>
        </header>
        <form id="authForm" class="auth-form">
          <label>
            API Token
            <input id="apiToken" name="apiToken" type="password" autocomplete="current-password" />
          </label>
          <button type="submit">保存</button>
        </form>
        <div class="toolbar">
          <button id="refreshJobs" type="button">刷新</button>
        </div>
        <nav id="jobList" class="job-list" aria-label="jobs"></nav>
      </aside>

      <main class="workspace">
        <section class="topbar">
          <div>
            <h2 id="jobTitle">选择一个 job</h2>
            <p id="jobMeta"></p>
          </div>
          <div class="topbar-actions">
            <button id="refreshReview" type="button" disabled>刷新审查</button>
          </div>
        </section>

        <section id="notice" class="notice hidden" role="status" aria-live="polite"></section>

        <section class="summary-grid">
          <article class="summary-card summary-card-wide">
            <h3>就绪状态</h3>
            <dl id="readiness"></dl>
            <div id="readinessDetails" class="detail-list"></div>
          </article>
          <article class="summary-card">
            <h3>TMDB</h3>
            <dl id="tmdbInfo"></dl>
          </article>
          <article class="summary-card">
            <h3>安全状态</h3>
            <dl id="safetyInfo"></dl>
          </article>
        </section>

        <section class="review-layout">
          <section class="review-main">
            <div class="tabs">
              <div class="tab-buttons" role="tablist">
                <button id="tabButtonMapping" class="tab active" data-tab="mapping" type="button" role="tab" aria-selected="true" aria-controls="tab-mapping">匹配</button>
                <button id="tabButtonFiles" class="tab" data-tab="files" type="button" role="tab" aria-selected="false" aria-controls="tab-files" tabindex="-1">文件</button>
                <button id="tabButtonMoves" class="tab" data-tab="moves" type="button" role="tab" aria-selected="false" aria-controls="tab-moves" tabindex="-1">移动</button>
                <button id="tabButtonRematch" class="tab" data-tab="rematch" type="button" role="tab" aria-selected="false" aria-controls="tab-rematch" tabindex="-1">重匹配</button>
                <button id="tabButtonEvidence" class="tab" data-tab="evidence" type="button" role="tab" aria-selected="false" aria-controls="tab-evidence" tabindex="-1">证据</button>
                <button id="tabButtonOperations" class="tab" data-tab="operations" type="button" role="tab" aria-selected="false" aria-controls="tab-operations" tabindex="-1">操作</button>
              </div>

              <div id="tab-mapping" class="tab-panel active" role="tabpanel" aria-labelledby="tabButtonMapping">
                <form id="correctionForm" class="correction-form">
                  <div class="section-heading">
                    <h3>手动修正</h3>
                    <button id="submitCorrection" type="submit" disabled>提交修正</button>
                  </div>
                  <div class="correction-grid">
                    <label>
                      目标 ID
                      <input id="correctionTargetId" type="number" min="1" inputmode="numeric" />
                    </label>
                    <label>
                      季
                      <input id="correctionSeason" type="number" min="0" inputmode="numeric" />
                    </label>
                    <label>
                      起始集
                      <input id="correctionStart" type="number" min="1" inputmode="numeric" />
                    </label>
                    <label>
                      结束集
                      <input id="correctionEnd" type="number" min="1" inputmode="numeric" />
                    </label>
                    <label>
                      字幕关联 ID
                      <input id="correctionSubtitleLinkId" type="number" min="1" inputmode="numeric" />
                    </label>
                    <label>
                      字幕变体
                      <select id="correctionVariant">
                        <option value="detected">自动检测</option>
                        <option value="chs">简体</option>
                        <option value="cht">繁体</option>
                        <option value="chi">中文</option>
                      </select>
                    </label>
                  </div>
                </form>
                <div class="split">
                  <section>
                    <h3>剧集目标</h3>
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>ID</th>
                            <th>视频源</th>
                            <th>目标</th>
                            <th>状态</th>
                            <th>字幕</th>
                          </tr>
                        </thead>
                        <tbody id="episodeRows"></tbody>
                      </table>
                    </div>
                  </section>
                  <section>
                    <h3>字幕关联</h3>
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>ID</th>
                            <th>目标</th>
                            <th>字幕源</th>
                            <th>变体</th>
                            <th>状态</th>
                          </tr>
                        </thead>
                        <tbody id="subtitleRows"></tbody>
                      </table>
                    </div>
                  </section>
                </div>
              </div>

              <div id="tab-files" class="tab-panel" role="tabpanel" aria-labelledby="tabButtonFiles">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>类型</th>
                        <th>路径</th>
                        <th>当前位置</th>
                        <th>处置</th>
                        <th>说明</th>
                      </tr>
                    </thead>
                    <tbody id="fileRows"></tbody>
                  </table>
                </div>
              </div>

              <div id="tab-moves" class="tab-panel" role="tabpanel" aria-labelledby="tabButtonMoves">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>源 ID</th>
                        <th>类型</th>
                        <th>源路径</th>
                        <th>计划目标</th>
                        <th>当前路径</th>
                        <th>状态</th>
                      </tr>
                    </thead>
                    <tbody id="moveRows"></tbody>
                  </table>
                </div>
              </div>

              <div id="tab-rematch" class="tab-panel" role="tabpanel" aria-labelledby="tabButtonRematch">
                <section>
                  <div class="section-heading">
                    <h3>重匹配预览</h3>
                  </div>
                  <dl id="rematchInfo"></dl>
                  <div class="table-wrap rematch-table">
                    <table>
                      <thead>
                        <tr>
                          <th>源 ID</th>
                          <th>类型</th>
                          <th>变化</th>
                          <th>当前计划目标</th>
                          <th>预览目标</th>
                        </tr>
                      </thead>
                      <tbody id="rematchRows"></tbody>
                    </table>
                  </div>
                </section>
              </div>

              <div id="tab-evidence" class="tab-panel" role="tabpanel" aria-labelledby="tabButtonEvidence">
                <div id="evidenceList" class="evidence-list"></div>
              </div>

              <div id="tab-operations" class="tab-panel" role="tabpanel" aria-labelledby="tabButtonOperations">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>结果</th>
                      </tr>
                    </thead>
                    <tbody id="operationRows"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>

          <aside class="operation-rail" aria-label="review 操作">
            <section class="operation-card">
              <div class="section-heading">
                <h3>重匹配</h3>
                <button id="commitRematch" class="primary-button" type="button" disabled>提交预览</button>
              </div>
              <form id="rematchForm" class="rematch-form">
                <label>
                  TMDB ID
                  <input id="tmdbInput" name="tmdbInput" type="number" min="1" inputmode="numeric" />
                </label>
                <button id="previewRematch" type="submit" disabled>预览重匹配</button>
              </form>
              <div id="tmdbCandidates" class="tmdb-candidates"></div>
            </section>

            <section class="operation-card">
              <div class="section-heading">
                <h3>应用</h3>
                <div class="button-pair">
                  <button id="validateApply" type="button" disabled>全量验证</button>
                  <button id="applyValidated" class="primary-button" type="button" disabled>应用验证结果</button>
                </div>
              </div>
              <dl id="validationInfo"></dl>
              <div id="validationDetails" class="detail-list"></div>
            </section>

            <section class="operation-card">
              <h3>回撤</h3>
              <dl id="rollbackInfo"></dl>
              <div id="rollbackFlow" class="rollback-flow" aria-label="回撤流程">
                <div id="rollbackSafetyStep" class="rollback-step">
                  <span class="step-index">1</span>
                  <div>
                    <strong>安全检查</strong>
                    <span id="rollbackSafetyStatus">未检查</span>
                  </div>
                </div>
                <div id="rollbackEligibilityStep" class="rollback-step">
                  <span class="step-index">2</span>
                  <div>
                    <strong>回撤资格</strong>
                    <span id="rollbackEligibilityStatus">未检查</span>
                  </div>
                </div>
                <div id="rollbackExecuteStep" class="rollback-step">
                  <span class="step-index">3</span>
                  <div>
                    <strong>执行</strong>
                    <span id="rollbackExecuteStatus">等待前置条件</span>
                  </div>
                </div>
                <div class="rollback-actions">
                  <button id="checkReviewSafety" type="button" disabled>检查安全</button>
                  <button id="checkRollback" type="button" disabled>检查回撤</button>
                  <button id="withdrawChecked" class="danger-outline-button" type="button" disabled>回撤全部</button>
                  <button id="reopenFromReview" type="button" disabled>重新打开</button>
                </div>
              </div>
              <div id="rollbackDetails" class="detail-list"></div>
            </section>
          </aside>
        </section>
      </main>
    </div>
    <dialog id="confirmDialog" class="confirm-dialog">
      <div class="confirm-box">
        <header>
          <h3 id="confirmTitle">确认操作</h3>
          <button id="confirmClose" type="button" aria-label="关闭">×</button>
        </header>
        <p id="confirmSummary" class="confirm-summary"></p>
        <div id="confirmDetails" class="confirm-details"></div>
        <footer>
          <button id="confirmCancel" type="button">取消</button>
          <button id="confirmProceed" type="button" class="danger-button">确认执行</button>
        </footer>
      </div>
    </dialog>
    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
